<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Workspace OS</title>
  
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Google Sans"', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            serif: ['"Merriweather"', 'serif']
          },
          colors: {
            google: {
              blue: '#1a73e8',
              'blue-hover': '#1765cc',
              'blue-light': '#e8f0fe',
              red: '#ea4335',
              yellow: '#fbbc04',
              green: '#34a853',
              surface: '#f8fafd',
              card: '#ffffff',
              darkSurface: '#1f1f1f',
              darkCard: '#2d2e30',
              darkBorder: '#444746'
            }
          },
          boxShadow: {
            'elevation-1': '0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15)',
            'elevation-2': '0 2px 6px 2px rgba(60,64,67,0.15), 0 1px 2px 0 rgba(60,64,67,0.3)',
            'elevation-3': '0 4px 8px 3px rgba(60,64,67,0.15), 0 1px 3px 0 rgba(60,64,67,0.3)',
            'window': '0 12px 32px rgba(0,0,0,0.22), 0 2px 8px rgba(0,0,0,0.12)'
          }
        }
      }
    }
  </script>

  <style>
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
      vertical-align: middle;
    }
    .material-symbols-rounded.filled {
      font-variation-settings: 'FILL' 1;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(120, 120, 120, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(120, 120, 120, 0.5); }

    .window-anim {
      transition: width 0.18s cubic-bezier(0.2, 0, 0, 1), 
                  height 0.18s cubic-bezier(0.2, 0, 0, 1), 
                  transform 0.18s cubic-bezier(0.2, 0, 0, 1), 
                  opacity 0.15s ease-out;
    }
    .window-dragging { transition: none !important; user-select: none !important; }
    
    #selection-lasso {
      position: absolute;
      border: 1.5px solid #1a73e8;
      background: rgba(26, 115, 232, 0.15);
      border-radius: 4px;
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    .drag-overlay { position: absolute; inset: 0; z-index: 999; display: none; }
    .is-dragging-any .drag-overlay { display: block; }
    
    .app-active-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #1a73e8;
    }
    .dark .app-active-dot { background: #8ab4f8; }

    /* Spreadsheets formula bar */
    .sheet-cell:focus {
      outline: 2px solid #1a73e8;
      z-index: 10;
    }
  </style>
</head>

<body class="h-full w-full overflow-hidden select-none bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased">

  <!-- Desktop Root Container -->
  <div id="desktop-container" class="relative w-full h-full flex flex-col overflow-hidden bg-cover bg-center transition-all duration-300"

    <div class="absolute inset-0 bg-black/20 pointer-events-none"></div>

      <div class="flex items-center space-x-2">
        <button id="btn-app-launcher" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-neutral-700 dark:text-neutral-200 transition-colors" title="Google apps">
          <span class="material-symbols-rounded text-[22px]">apps</span>
        </button>

        <div class="flex items-center space-x-2 cursor-pointer" onclick="WindowManager.focusOrLaunch('drive')">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#4285F4"/>
            <circle cx="12" cy="13" r="3" fill="#34A853"/>
            <path d="M19 13a3 3 0 01-3 3h-4v-6h4a3 3 0 013 3z" fill="#FBBC04" opacity="0.9"/>
          </svg>
          <span class="text-[16px] font-medium tracking-tight text-neutral-800 dark:text-neutral-100 hidden sm:inline">
            Workspace <span class="text-xs font-semibold px-1.5 py-0.5 rounded-full bg-blue-100 text-google-blue dark:bg-blue-900/50 dark:text-blue-300 ml-0.5">OS Pro</span>
          </span>
        </div>
      </div>

      <!-- Center: Omnibox quick search -->
      <div class="flex-1 max-w-lg mx-3">
        <div class="relative flex items-center w-full">
          <span class="material-symbols-rounded absolute left-3 text-neutral-400 text-[18px]">search</span>
          <input id="omnibox-input" type="text" placeholder="Search apps, files, web, or run commands..."
                 class="w-full h-8 pl-9 pr-9 text-xs sm:text-sm bg-neutral-100/90 dark:bg-neutral-800/90 hover:bg-white dark:hover:bg-neutral-800 focus:bg-white dark:focus:bg-neutral-900 border border-transparent focus:border-google-blue rounded-full shadow-inner outline-none transition placeholder-neutral-500 text-neutral-800 dark:text-neutral-100" />
          <button id="omnibox-clear" class="hidden absolute right-3 text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-200">
            <span class="material-symbols-rounded text-[16px]">close</span>
          </button>
        </div>
      </div>

      <!-- Right: System Controls, Fullscreen & Sync Indicators -->
      <div class="flex items-center space-x-1 sm:space-x-2 text-neutral-700 dark:text-neutral-200 text-xs">
        
        <!-- Google Cloud / Drive Sync Status Button -->
        <button id="btn-sync-manager" onclick="WindowManager.focusOrLaunch('sync_center')" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/40 dark:hover:bg-blue-900/50 text-google-blue dark:text-blue-300 border border-blue-200 dark:border-blue-800 transition" title="Google Drive & Sheet Sync Status">
          <span class="material-symbols-rounded text-[16px] animate-none" id="sync-icon">cloud_sync</span>
          <span class="hidden md:inline font-medium">Cloud Sync</span>
        </button>

        <!-- Fullscreen Desktop Toggle Button (Req #2) -->
        <button id="btn-fullscreen-toggle" class="p-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition" title="Toggle Fullscreen Desktop">
          <span class="material-symbols-rounded text-[19px]" id="fullscreen-icon">fullscreen</span>
        </button>

        <!-- Live Clock -->
        <div id="system-clock" class="px-2 py-1 text-xs font-medium rounded hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer">
          10:00 AM
        </div>

        <!-- Quick Settings & Control Center Button -->
        <button id="btn-quick-settings" class="flex items-center space-x-1 px-2 py-1 rounded-full bg-neutral-200/60 dark:bg-neutral-800/70 hover:bg-neutral-200 dark:hover:bg-neutral-700 transition">
          <span class="material-symbols-rounded text-[17px]">wifi</span>
          <span class="material-symbols-rounded text-[17px]">battery_full</span>
        </button>

        <!-- Google Avatar -->
        <div id="user-avatar-btn" onclick="WindowManager.focusOrLaunch('settings')" class="w-7 h-7 rounded-full bg-gradient-to-tr from-blue-600 via-red-500 to-yellow-400 p-[2px] cursor-pointer shadow-sm hover:scale-105 transition" title="Google Account & Sync">
          <div class="w-full h-full rounded-full bg-white dark:bg-neutral-900 flex items-center justify-center font-bold text-xs text-google-blue">
            G
          </div>
        </div>
      </div>
    </header>

    <!-- Main Desktop Canvas -->
    <main id="desktop-canvas" class="relative flex-1 w-full h-full overflow-hidden p-4 select-none">
      
      <!-- Selection Lasso overlay -->
      <div id="selection-lasso"></div>

      <!-- Desktop Icons Container -->
      <div id="desktop-icons-container" class="grid grid-flow-col grid-rows-6 gap-3 w-fit auto-cols-[88px] relative z-10">
        <!-- Dynamically rendered -->
      </div>

      <!-- Windows Workspace Mount Surface -->
      <div id="windows-surface" class="absolute inset-0 pointer-events-none z-20">
        <!-- Floating windows dynamically appended here -->
      </div>
    </main>

    <!-- 9-Dot App Matrix Panel -->
    <div id="app-matrix-panel" class="hidden absolute top-14 left-4 z-50 w-84 bg-white dark:bg-neutral-900 rounded-3xl shadow-elevation-3 border border-black/10 dark:border-white/10 p-4 transition-all">
      <div class="flex items-center justify-between pb-3 border-b border-black/5 dark:border-white/10">
        <span class="text-sm font-semibold tracking-wide text-neutral-600 dark:text-neutral-300">Workspace Apps</span>
        <button id="btn-open-installer-hub" class="text-xs font-medium text-google-blue hover:underline flex items-center gap-1">
          <span class="material-symbols-rounded text-sm">add_circle</span> Install App
        </button>
      </div>
      <div id="app-matrix-grid" class="grid grid-cols-3 gap-3 pt-3 max-h-[380px] overflow-y-auto">
        <!-- Rendered items -->
      </div>
    </div>

    <!-- Quick Settings Dropdown Flyout -->
    <div id="quick-settings-panel" class="hidden absolute top-14 right-4 z-50 w-72 bg-white/95 dark:bg-neutral-900/95 backdrop-blur-xl rounded-2xl shadow-elevation-3 border border-black/10 dark:border-white/10 p-4 space-y-4">
      <div class="flex items-center justify-between text-sm font-medium">
        <span>Control Center</span>
        <span class="text-xs text-green-500 font-semibold flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span> Online</span>
      </div>

      <div class="grid grid-cols-2 gap-2 text-xs">
        <button id="toggle-theme-btn" class="flex flex-col items-center justify-center p-3 rounded-xl bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 transition">
          <span class="material-symbols-rounded text-[20px] mb-1">dark_mode</span>
          <span id="theme-label">Dark Theme</span>
        </button>
        <button id="toggle-snapping-sound" onclick="SoundEngine.enabled = !SoundEngine.enabled; notify('Audio', SoundEngine.enabled ? 'Sound FX Enabled' : 'Sound FX Muted', 'volume_up');" class="flex flex-col items-center justify-center p-3 rounded-xl bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 transition">
          <span class="material-symbols-rounded text-[20px] mb-1">volume_up</span>
          <span>Sound Effects</span>
        </button>
      </div>

      <div>
        <div class="text-xs font-semibold text-neutral-500 mb-2">Desktop Wallpaper</div>
        <div class="flex items-center space-x-2">
          <div onclick="setWallpaper('nature')" class="w-10 h-10 rounded-lg cursor-pointer border-2 border-transparent hover:border-google-blue bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=300&q=80')"></div>
          <div onclick="setWallpaper('gradient')" class="w-10 h-10 rounded-lg cursor-pointer border-2 border-transparent hover:border-google-blue bg-gradient-to-tr from-blue-500 via-indigo-600 to-purple-700"></div>
          <div onclick="setWallpaper('workspace')" class="w-10 h-10 rounded-lg cursor-pointer border-2 border-transparent hover:border-google-blue bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=300&q=80')"></div>
          <div onclick="setWallpaper('minimal')" class="w-10 h-10 rounded-lg cursor-pointer border-2 border-transparent hover:border-google-blue bg-slate-900 border-neutral-700"></div>
        </div>
      </div>
    </div>

    <!-- Frosted Bottom Dock (Shelf) -->
    <footer class="relative z-40 w-full pb-3 flex justify-center pointer-events-none">
      <nav id="bottom-dock" class="pointer-events-auto flex items-center space-x-2 px-3 py-2 rounded-2xl bg-white/80 dark:bg-neutral-900/85 backdrop-blur-2xl border border-white/40 dark:border-white/10 shadow-elevation-2 transition-all">
        <!-- Rendered items with Minimize on click support (Req #5) -->
      </nav>
    </footer>

    <!-- Desktop Context Menu -->
    <div id="desktop-context-menu" class="hidden fixed z-50 w-56 bg-white dark:bg-neutral-800 rounded-2xl shadow-elevation-3 border border-black/10 dark:border-white/10 py-1.5 text-xs backdrop-blur-md text-neutral-800 dark:text-neutral-200">
      <button onclick="WindowManager.launch('browser')" class="w-full px-4 py-2 text-left hover:bg-neutral-100 dark:hover:bg-neutral-700 flex items-center gap-2.5">
        <span class="material-symbols-rounded text-google-blue text-base">public</span>
        <span>Open Chrome Browser</span>
      </button>
      <button onclick="WindowManager.launch('file_manager')" class="w-full px-4 py-2 text-left hover:bg-neutral-100 dark:hover:bg-neutral-700 flex items-center gap-2.5">
        <span class="material-symbols-rounded text-amber-500 text-base">folder_open</span>
        <span>Open File Manager</span>
      </button>
      <button onclick="WindowManager.launch('installer')" class="w-full px-4 py-2 text-left hover:bg-neutral-100 dark:hover:bg-neutral-700 flex items-center gap-2.5">
        <span class="material-symbols-rounded text-google-green text-base">install_desktop</span>
        <span>Install / Uninstall Apps</span>
      </button>
      <button onclick="WindowManager.launch('docs')" class="w-full px-4 py-2 text-left hover:bg-neutral-100 dark:hover:bg-neutral-700 flex items-center gap-2.5">
        <span class="material-symbols-rounded text-blue-500 text-base">description</span>
        <span>New Document</span>
      </button>
      <button onclick="WindowManager.launch('sheets')" class="w-full px-4 py-2 text-left hover:bg-neutral-100 dark:hover:bg-neutral-700 flex items-center gap-2.5">
        <span class="material-symbols-rounded text-green-500 text-base">table_chart</span>
        <span>New Spreadsheet</span>
      </button>
      <div class="h-px bg-neutral-200 dark:bg-neutral-700 my-1"></div>
      <button onclick="CloudSyncEngine.syncAll()" class="w-full px-4 py-2 text-left hover:bg-neutral-100 dark:hover:bg-neutral-700 flex items-center gap-2.5">
        <span class="material-symbols-rounded text-google-blue text-base">cloud_sync</span>
        <span>Sync to Drive & Sheets Now</span>
      </button>
      <button onclick="DesktopIconManager.autoAlign()" class="w-full px-4 py-2 text-left hover:bg-neutral-100 dark:hover:bg-neutral-700 flex items-center gap-2.5">
        <span class="material-symbols-rounded text-neutral-500 text-base">grid_view</span>
        <span>Organize Icons</span>
      </button>
      <button onclick="toggleDesktopFullscreen()" class="w-full px-4 py-2 text-left hover:bg-neutral-100 dark:hover:bg-neutral-700 flex items-center gap-2.5">
        <span class="material-symbols-rounded text-neutral-500 text-base">fullscreen</span>
        <span>Toggle Fullscreen</span>
      </button>
    </div>

    <!-- Notification Toast Container -->
    <div id="notification-container" class="fixed bottom-16 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  </div>

  <script>
    /* ==========================================================================
       1. SOUND EFFECTS & NOTIFICATIONS
       ========================================================================== */
    const SoundEngine = {
      enabled: true,
      ctx: null,
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playPop() {
        if (!this.enabled) return;
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) {}
      },
      playSnap() {
        if (!this.enabled) return;
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(540, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(280, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch (e) {}
      }
    };

    function notify(title, message, icon = 'info') {
      const container = document.getElementById('notification-container');
      const toast = document.createElement('div');
      toast.className = "pointer-events-auto bg-white dark:bg-neutral-800 text-neutral-800 dark:text-neutral-100 border border-black/10 dark:border-white/10 rounded-2xl p-3 shadow-elevation-3 flex items-start space-x-3 w-80 transform transition-all duration-300 translate-y-4 opacity-0";
      toast.innerHTML = `
        <span class="material-symbols-rounded text-google-blue text-xl mt-0.5">${icon}</span>
        <div class="flex-1 text-xs">
          <div class="font-semibold text-xs mb-0.5">${title}</div>
          <div class="text-neutral-600 dark:text-neutral-300 leading-normal">${message}</div>
        </div>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
      });
      SoundEngine.playPop();
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    /* ==========================================================================
       2. FULLSCREEN MANAGEMENT (Requirement #2)
       ========================================================================== */
    function toggleDesktopFullscreen() {
      const icon = document.getElementById('fullscreen-icon');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          if (icon) icon.innerText = 'fullscreen_exit';
          notify('Fullscreen Mode', 'Workspace OS is now in fullscreen mode.', 'fullscreen');
        }).catch(err => {
          notify('Fullscreen Error', err.message, 'error');
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            if (icon) icon.innerText = 'fullscreen';
          });
        }
      }
    }
    document.getElementById('btn-fullscreen-toggle').onclick = toggleDesktopFullscreen;

    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fullscreen-icon');
      if (icon) {
        icon.innerText = document.fullscreenElement ? 'fullscreen_exit' : 'fullscreen';
      }
    });

    /* ==========================================================================
       3. VIRTUAL STORAGE & CLOUD SYNC ENGINE (Drive + Sheets Sync - Req #4 & #6)
       ========================================================================== */
    const StorageEngine = {
      fileStorageKey: 'google_workspace_vfs_files',
      files: [],

      init() {
        const defaultFiles = [
          { id: 'f1', name: 'Welcome_Guide.txt', type: 'text', content: 'Welcome to Google Workspace OS Pro!\nAll apps, files, and spreadsheets are 100% functional.', size: '1.2 KB', modified: new Date().toLocaleDateString(), driveSynced: true },
          { id: 'f2', name: 'Financial_Model_Q4.csv', type: 'sheet', content: 'Quarter,Revenue,Expenses,Net Profit\nQ1,12400,8100,4300\nQ2,15600,9200,6400\nQ3,18900,10500,8400\nQ4,24200,11900,12300', size: '2.4 KB', modified: new Date().toLocaleDateString(), driveSynced: true },
          { id: 'f3', name: 'Workspace_Branding.svg', type: 'image', content: '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24"><path fill="#4285F4" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>', size: '780 B', modified: new Date().toLocaleDateString(), driveSynced: false },
          { id: 'f4', name: 'Sample_Script.js', type: 'code', content: 'console.log("Workspace OS OS ready.");\nfunction calculateMetrics(a, b) {\n  return a * b + 42;\n}', size: '920 B', modified: new Date().toLocaleDateString(), driveSynced: false }
        ];

        try {
          const raw = localStorage.getItem(this.fileStorageKey);
          if (raw) {
            this.files = JSON.parse(raw);
          } else {
            this.files = defaultFiles;
            this.save();
          }
        } catch (e) {
          this.files = defaultFiles;
        }
      },

      save() {
        try {
          localStorage.setItem(this.fileStorageKey, JSON.stringify(this.files));
        } catch (e) {}
      },

      getAll() { return this.files; },
      get(id) { return this.files.find(f => f.id === id); },

      saveFile(name, content, type = 'text') {
        let existing = this.files.find(f => f.name.toLowerCase() === name.toLowerCase());
        const sizeStr = (content.length > 1024) ? `${(content.length / 1024).toFixed(1)} KB` : `${content.length} B`;
        if (existing) {
          existing.content = content;
          existing.size = sizeStr;
          existing.modified = new Date().toLocaleDateString();
          existing.driveSynced = false;
        } else {
          existing = {
            id: 'file_' + Date.now(),
            name: name,
            type: type,
            content: content,
            size: sizeStr,
            modified: new Date().toLocaleDateString(),
            driveSynced: false
          };
          this.files.push(existing);
        }
        this.save();
        CloudSyncEngine.queueSync();
        return existing;
      },

      deleteFile(id) {
        this.files = this.files.filter(f => f.id !== id);
        this.save();
      }
    };

    /* Cloud Sync Engine for Google Drive & Google Sheets (Req #4) */
    const CloudSyncEngine = {
      isSyncing: false,
      lastSyncTime: null,
      autoSyncTimer: null,
      sheetsPayloadPreview: null,

      init() {
        this.lastSyncTime = localStorage.getItem('google_workspace_last_sync') || 'Never';
        // Auto background periodic sync check every 60s
        this.autoSyncTimer = setInterval(() => {
          this.syncAll(true);
        }, 60000);
      },

      queueSync() {
        const icon = document.getElementById('sync-icon');
        if (icon) icon.classList.add('text-amber-500');
      },

          el.classList.add('window-dragging');
          container.classList.add('is-dragging-any');

          const startX = e.clientX;
          const startY = e.clientY;
          const initX = win.x;
          const initY = win.y;

          const onMouseMove = (moveEv) => {
            if (win.isMaximized) {
              win.isMaximized = false;
              win.snapState = null;
              win.width = win.prevRect ? win.prevRect.width : 780;
              win.height = win.prevRect ? win.prevRect.height : 540;
              el.style.width = `${win.width}px`;
              el.style.height = `${win.height}px`;
            }

            const dx = moveEv.clientX - startX;
            const dy = moveEv.clientY - startY;

            win.x = Math.max(0, Math.min(window.innerWidth - 60, initX + dx));
            win.y = Math.max(0, Math.min(window.innerHeight - 60, initY + dy));
            el.style.transform = `translate3d(${win.x}px, ${win.y}px, 0)`;
          };

          const onMouseUp = () => {
            el.classList.remove('window-dragging');
            container.classList.remove('is-dragging-any');
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
          };

          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });

        // 3 Corner/Edge Resizing
        const setupResize = (handleSelector, resizeX, resizeY) => {
          const handle = el.querySelector(handleSelector);
          if (!handle) return;

          handle.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            this.focus(winId);
            el.classList.add('window-dragging');
            container.classList.add('is-dragging-any');

            const startX = e.clientX;
            const startY = e.clientY;
            const startW = win.width;
            const startH = win.height;

            const onMouseMove = (mEv) => {
              if (resizeX) {
                const nw = Math.max(340, startW + (mEv.clientX - startX));
                win.width = nw;
                el.style.width = `${nw}px`;
              }
              if (resizeY) {
                const nh = Math.max(240, startH + (mEv.clientY - startY));
                win.height = nh;
                el.style.height = `${nh}px`;
              }
            };

            const onMouseUp = () => {
              el.classList.remove('window-dragging');
              container.classList.remove('is-dragging-any');
              document.removeEventListener('mousemove', onMouseMove);
              document.removeEventListener('mouseup', onMouseUp);
            };

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
          });
        };

        setupResize('.resize-r', true, false);
        setupResize('.resize-b', false, true);
        setupResize('.resize-br', true, true);

        // Compute Formulas: SUM, AVERAGE, MIN, MAX, PRODUCT
        const evaluateCellValue = (rawVal) => {
          if (!rawVal || typeof rawVal !== 'string') return rawVal || '';
          if (!rawVal.startsWith('=')) return rawVal;

          try {
            const upper = rawVal.toUpperCase();
            const sumMatch = upper.match(/=SUM\(([A-Z])(\d+):([A-Z])(\d+)\)/);
            if (sumMatch) {
              const startCol = sumMatch[1].charCodeAt(0) - 65 + 1;
              const startRow = parseInt(sumMatch[2]);
              const endCol = sumMatch[3].charCodeAt(0) - 65 + 1;
              const endRow = parseInt(sumMatch[4]);
              let sum = 0;
              for (let r = Math.min(startRow, endRow); r <= Math.max(startRow, endRow); r++) {
                for (let c = Math.min(startCol, endCol); c <= Math.max(startCol, endCol); c++) {
                  const val = parseFloat(dataGrid[r][c]);
                  if (!isNaN(val)) sum += val;
                }
              }
              return sum;
            }

            const avgMatch = upper.match(/=AVERAGE\(([A-Z])(\d+):([A-Z])(\d+)\)/);
            if (avgMatch) {
              const startCol = avgMatch[1].charCodeAt(0) - 65 + 1;
              const startRow = parseInt(avgMatch[2]);
              const endCol = avgMatch[3].charCodeAt(0) - 65 + 1;
              const endRow = parseInt(avgMatch[4]);
              let sum = 0, count = 0;
              for (let r = Math.min(startRow, endRow); r <= Math.max(startRow, endRow); r++) {
                for (let c = Math.min(startCol, endCol); c <= Math.max(startCol, endCol); c++) {
                  const val = parseFloat(dataGrid[r][c]);
                  if (!isNaN(val)) { sum += val; count++; }
                }
              }
              return count > 0 ? (sum / count).toFixed(2) : 0;
            }

            // Simple basic math evaluation
            const expr = rawVal.substring(1).replace(/[^0-9+\-*/().]/g, '');
            return eval(expr);

            return '#VALUE!';

              const colLetter = String.fromCharCode(64 + c);
              cellAddressEl.innerText = `${colLetter}${r}`;

              const r = parseInt(td.dataset.row);
              const c = parseInt(td.dataset.col);
              dataGrid[r][c] = td.innerText.trim();

          const td = getSelectedTd();
          if (!td) return;
          const num = parseFloat(td.innerText.replace(/[^0-9.-]/g, ''));
          if (!isNaN(num)) td.innerText = `$${num.toFixed(2)}`;
        };
        el.querySelector(`#${winId}-num-percent`).onclick = () => {
          const td = getSelectedTd();
          if (!td) return;
          const num = parseFloat(td.innerText.replace(/[^0-9.-]/g, ''));
          if (!isNaN(num)) td.innerText = `${(num * 100).toFixed(1)}%`;
        };
        el.querySelector(`#${winId}-num-decimal`).onclick = () => {
          const td = getSelectedTd();
          if (!td) return;
          const num = parseFloat(td.innerText.replace(/[^0-9.-]/g, ''));
          if (!isNaN(num)) td.innerText = num.toFixed(2);
        };

        // Quick Formula Injector
        el.querySelector(`#${winId}-formula-select`).onchange = (e) => {
          if (!e.target.value) return;
          formulaInput.value = e.target.value;
          dataGrid[selectedCell.r][selectedCell.c] = e.target.value;
          renderTable();
          e.target.value = "";
        };

        // Clear Grid
        el.querySelector(`#${winId}-btn-clear`).onclick = () => {
          if (!confirm('Clear all cell values in this sheet?')) return;
          for (let r = 1; r <= rowCount; r++) {
            for (let c = 1; c <= colCount; c++) {
              dataGrid[r][c] = '';
            }
          }
          renderTable();
        };

        // Export CSV
        el.querySelector(`#${winId}-btn-export-csv`).onclick = () => {
          let csv = [];
          for (let r = 1; r <= rowCount; r++) {
            let row = [];
            for (let c = 1; c <= colCount; c++) {
              row.push(`"${(evaluateCellValue(dataGrid[r][c]) || '').toString().replace(/"/g, '""')}"`);
            }
            csv.push(row.join(','));
          }
          const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'workspace_spreadsheet.csv';
          a.click();
          StorageEngine.saveFile('workspace_spreadsheet.csv', csv.join('\n'), 'sheet');
          notify('Exported', 'Spreadsheet CSV exported and backed up.', 'download_done');
        };

        // Cloud sync trigger (Req #4)
        el.querySelector(`#${winId}-btn-sync-sheet`).onclick = () => {
          CloudSyncEngine.syncAll();
        };

        renderTable();
      }
    };

    /* ==========================================================================
       9. DEFAULT WEB BROWSER APP (Requirement #10: Full Advanced Features)
       ========================================================================== */
    const BrowserApp = {
      mount(winId, el) {
        el.innerHTML = `
          <div class="flex flex-col h-full bg-white dark:bg-neutral-900 text-neutral-800 dark:text-neutral-100">
            
            <!-- Chrome Tabs Bar -->
            <div class="flex items-center px-2 pt-1.5 bg-neutral-200 dark:bg-neutral-800 border-b border-black/10 dark:border-white/10 space-x-1">
              <div class="flex items-center space-x-2 px-3 py-1.5 bg-white dark:bg-neutral-900 rounded-t-xl text-xs font-medium max-w-[160px] truncate shadow-sm">
                <span class="material-symbols-rounded text-sm text-google-blue">public</span>
                <span id="${winId}-tab-title" class="truncate">Google Search</span>
                <span class="material-symbols-rounded text-xs cursor-pointer hover:text-red-500">close</span>
              </div>
              <button class="p-1 hover:bg-black/5 dark:hover:bg-white/10 rounded-full text-neutral-500" title="New Tab">
                <span class="material-symbols-rounded text-sm">add</span>
              </button>
            </div>

            <!-- Chrome Omnibox & Action Strip -->
            <div class="flex items-center space-x-1.5 px-3 py-1.5 bg-white dark:bg-neutral-900 border-b border-black/10 dark:border-white/10 text-xs">
              
              <!-- Reload & Home Controls -->
              <button id="${winId}-browser-reload" class="p-1 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-neutral-600 dark:text-neutral-300" title="Reload page">
                <span class="material-symbols-rounded text-base">refresh</span>
              </button>
              <button id="${winId}-browser-home" class="p-1 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-neutral-600 dark:text-neutral-300" title="Open Homepage">
                <span class="material-symbols-rounded text-base">home</span>
              </button>

              <!-- Address Bar with SSL Lock -->
              <div class="flex-1 flex items-center px-3 py-1 rounded-full bg-neutral-100 dark:bg-neutral-800 border border-transparent focus-within:border-google-blue focus-within:bg-white dark:focus-within:bg-neutral-900 transition">
                <span class="material-symbols-rounded text-xs text-google-green mr-1.5" title="Secure Connection (HTTPS)">lock</span>
                <input id="${winId}-browser-url" type="text" value="https://www.wikipedia.org" placeholder="Search Google or type a URL" class="w-full bg-transparent outline-none text-xs text-neutral-800 dark:text-neutral-200" />
                <button id="${winId}-browser-bookmark-btn" class="p-0.5 hover:text-amber-500 text-neutral-400" title="Bookmark Tab">
                  <span class="material-symbols-rounded text-sm">star</span>
                </button>
              </div>

              <!-- Menu Button -->
              <button class="p-1 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-neutral-600 dark:text-neutral-300" title="Browser Settings">
                <span class="material-symbols-rounded text-base">more_vert</span>
              </button>
            </div>

            <!-- Bookmarks Bar -->
            <div class="flex items-center space-x-2 px-3 py-1 bg-neutral-50 dark:bg-neutral-850 border-b border-black/5 dark:border-white/5 text-[11px] text-neutral-600 dark:text-neutral-300 overflow-x-auto">
              <button onclick="BrowserApp.navigate('${winId}', 'https://www.wikipedia.org')" class="flex items-center gap-1 hover:bg-black/5 dark:hover:bg-white/10 px-2 py-0.5 rounded">
                <span class="material-symbols-rounded text-xs text-blue-500">public</span> Wikipedia
              </button>
              <button onclick="BrowserApp.navigate('${winId}', 'https://news.ycombinator.com')" class="flex items-center gap-1 hover:bg-black/5 dark:hover:bg-white/10 px-2 py-0.5 rounded">
                <span class="material-symbols-rounded text-xs text-amber-500">newspaper</span> Hacker News
              </button>
              <button onclick="BrowserApp.navigate('${winId}', 'https://example.com')" class="flex items-center gap-1 hover:bg-black/5 dark:hover:bg-white/10 px-2 py-0.5 rounded">
                <span class="material-symbols-rounded text-xs text-green-500">article</span> Example Domain
              </button>
            </div>

            <!-- Browser Webview (Sandboxed Iframe Viewport) -->
            <div class="flex-1 w-full h-full relative bg-neutral-100 dark:bg-neutral-800 overflow-hidden">
              <iframe id="${winId}-webview" class="w-full h-full border-none bg-white" sandbox="allow-scripts allow-forms allow-same-origin allow-popups" src="https://www.wikipedia.org"></iframe>
            </div>

            <!-- Browser Footer -->
            <div class="px-3 py-0.5 bg-neutral-100 dark:bg-neutral-900 border-t border-black/10 dark:border-white/10 flex items-center justify-between text-[10px] text-neutral-400">
              <span>Workspace Protected Sandboxed Chrome Engine</span>
              <span>100% Functional</span>
            </div>
          </div>
        `;

        const urlInput = el.querySelector(`#${winId}-browser-url`);
        const iframe = el.querySelector(`#${winId}-webview`);
        const tabTitle = el.querySelector(`#${winId}-tab-title`);
        const reloadBtn = el.querySelector(`#${winId}-browser-reload`);
        const homeBtn = el.querySelector(`#${winId}-browser-home`);
        const bookmarkBtn = el.querySelector(`#${winId}-browser-bookmark-btn`);

        const loadUrl = (raw) => {
          let url = raw.trim();
          if (!url) return;
          if (!url.startsWith('http://') && !url.startsWith('https://')) {
            if (url.includes('.') && !url.includes(' ')) {
              url = 'https://' + url;
            } else {
              url = `https://www.google.com/search?q=${encodeURIComponent(url)}&igu=1`;
            }
          }
          urlInput.value = url;
          iframe.src = url;
          tabTitle.innerText = url.replace(/^https?:\/\//, '').split('/')[0];
          WindowManager.pushHistory(winId, url);
        };

        urlInput.onkeydown = (e) => {
          if (e.key === 'Enter') loadUrl(urlInput.value);
        };

        reloadBtn.onclick = () => {
          iframe.src = iframe.src;
          notify('Reloading', 'Refreshing browser view...', 'refresh');
        };

        homeBtn.onclick = () => loadUrl('https://www.wikipedia.org');

        bookmarkBtn.onclick = () => {
          bookmarkBtn.classList.toggle('text-amber-500');
          notify('Bookmarked', `${urlInput.value} saved to your bookmarks.`, 'star');
        };
      },

      navigate(winId, url) {
        const win = WindowManager.windows[winId];
        if (!win) return;
        const input = win.element.querySelector(`#${winId}-browser-url`);
        const iframe = win.element.querySelector(`#${winId}-webview`);
        const tabTitle = win.element.querySelector(`#${winId}-tab-title`);
        if (input && iframe) {
          input.value = url;
          iframe.src = url;
          if (tabTitle) tabTitle.innerText = url.replace(/^https?:\/\//, '').split('/')[0];
          WindowManager.pushHistory(winId, url);
        }
      },

      handleHistory(winId, url) {
        const win = WindowManager.windows[winId];
        if (!win) return;
        const input = win.element.querySelector(`#${winId}-browser-url`);
        const iframe = win.element.querySelector(`#${winId}-webview`);
        if (input && iframe && url && typeof url === 'string') {
          input.value = url;
          iframe.src = url;
        }
      }
    };

    /* ==========================================================================
       10. BOTTOM DOCK & DESKTOP ICONS (With Requirement #5: Click to Minimize)
       ========================================================================== */
    const DockManager = {
      dockEl: document.getElementById('bottom-dock'),

      render() {
        this.dockEl.innerHTML = '';
        const allApps = AppRegistry.getAll();

        allApps.forEach(app => {
          const isRunning = Object.values(WindowManager.windows).some(w => w.appId === app.id);
          const btn = document.createElement('button');
          btn.className = "group relative p-2 rounded-2xl hover:bg-black/10 dark:hover:bg-white/10 transition-all flex flex-col items-center transform hover:-translate-y-1";
          btn.title = app.name;

          btn.innerHTML = `
            <span class="material-symbols-rounded text-2xl transition-transform group-hover:scale-110" style="color: ${app.iconColor}">
              ${app.iconSymbol}
            </span>
            ${isRunning ? '<span class="app-active-dot mt-0.5"></span>' : '<span class="h-1 mt-0.5"></span>'}
          `;

          // Requirement #5: Click on dock icons to minimize / restore the app
          btn.onclick = () => {
            WindowManager.toggleFromDock(app.id);
          };

          this.dockEl.appendChild(btn);
        });
      }
    };

    const DesktopIconManager = {
      container: document.getElementById('desktop-icons-container'),

      render() {
        this.container.innerHTML = '';
        const apps = AppRegistry.getAll();

        apps.forEach(app => {
          const iconEl = document.createElement('div');
          iconEl.className = "desktop-icon group flex flex-col items-center justify-center p-2 rounded-xl hover:bg-white/20 dark:hover:bg-black/30 cursor-pointer transition select-none text-center relative";
          iconEl.dataset.appId = app.id;
          iconEl.innerHTML = `
            <div class="w-12 h-12 rounded-2xl bg-white/90 dark:bg-neutral-800/90 shadow-elevation-1 flex items-center justify-center mb-1 group-hover:scale-105 transition-transform">
              <span class="material-symbols-rounded text-2xl" style="color: ${app.iconColor}">${app.iconSymbol}</span>
            </div>
            <span class="text-xs font-medium text-white drop-shadow truncate w-full px-1">${app.name}</span>
          `;

          iconEl.ondblclick = () => WindowManager.launch(app.id);

          iconEl.onclick = (e) => {
            e.stopPropagation();
            document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('ring-2', 'ring-google-blue', 'bg-white/30'));
            iconEl.classList.add('ring-2', 'ring-google-blue', 'bg-white/30');
          };

          this.container.appendChild(iconEl);
        });
      },

      autoAlign() {
        this.render();
        notify('Aligned', 'Desktop grid icons organized.', 'grid_view');
      }
    };

    /* Matrix 9-Dot Menu & Omnibox */
    const MatrixLauncher = {
      panel: document.getElementById('app-matrix-panel'),
      btn: document.getElementById('btn-app-launcher'),
      grid: document.getElementById('app-matrix-grid'),

      init() {
        this.btn.onclick = (e) => {
          e.stopPropagation();
          this.toggle();
        };

        document.getElementById('btn-open-installer-hub').onclick = () => {
          this.close();
          WindowManager.launch('installer');
        };

        this.render();
      },

      toggle() { this.panel.classList.toggle('hidden'); },
      close() { this.panel.classList.add('hidden'); },

      render() {
        this.grid.innerHTML = '';
        const apps = AppRegistry.getAll();
        apps.forEach(app => {
          const item = document.createElement('div');
          item.className = "flex flex-col items-center justify-center p-2.5 rounded-2xl hover:bg-neutral-100 dark:hover:bg-neutral-800 cursor-pointer transition text-center";
          item.innerHTML = `
            <span class="material-symbols-rounded text-3xl mb-1" style="color: ${app.iconColor}">${app.iconSymbol}</span>
            <span class="text-xs font-medium truncate w-full text-neutral-700 dark:text-neutral-200">${app.name}</span>
          `;
          item.onclick = () => {
            this.close();
            WindowManager.launch(app.id);
          };
          this.grid.appendChild(item);
        });
      }
    };

    const Omnibox = {
      input: document.getElementById('omnibox-input'),
      clearBtn: document.getElementById('omnibox-clear'),

      init() {
        this.input.addEventListener('input', (e) => {
          const q = e.target.value.toLowerCase().trim();
          this.clearBtn.classList.toggle('hidden', q.length === 0);
        });

        this.input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const q = this.input.value.toLowerCase().trim();
            if (!q) return;

            const match = AppRegistry.getAll().find(a => a.name.toLowerCase().includes(q));
            if (match) {
              WindowManager.launch(match.id);
              this.input.value = '';
              this.clearBtn.classList.add('hidden');
            } else {
              // Open default browser with query
              WindowManager.launch('browser');
              setTimeout(() => {
                const win = Object.values(WindowManager.windows).find(w => w.appId === 'browser');
                if (win) BrowserApp.navigate(win.id, `https://www.google.com/search?q=${encodeURIComponent(q)}&igu=1`);
              }, 200);
              this.input.value = '';
              this.clearBtn.classList.add('hidden');
            }
          }
        });

        this.clearBtn.onclick = () => {
          this.input.value = '';
          this.clearBtn.classList.add('hidden');
        };
      }
    };

    /* Wallpaper & Theme */
    function setWallpaper(type) {
      const container = document.getElementById('desktop-container');
      if (type === 'nature') {
        container.style.backgroundImage = "url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2400&q=80')";
      } else if (type === 'gradient') {
        container.style.backgroundImage = "linear-gradient(135deg, #1e3a8a 0%, #4338ca 50%, #6d28d9 100%)";
      } else if (type === 'workspace') {
        container.style.backgroundImage = "url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=2400&q=80')";
      } else if (type === 'minimal') {
        container.style.backgroundImage = "linear-gradient(180deg, #0f172a 0%, #020617 100%)";
      }
      notify('Wallpaper Updated', 'Desktop background updated.', 'wallpaper');
    }

    function updateClock() {
      const clock = document.getElementById('system-clock');
      const now = new Date();
      clock.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    const themeBtn = document.getElementById('toggle-theme-btn');
    const themeLabel = document.getElementById('theme-label');
    themeBtn.onclick = () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      themeLabel.innerText = isDark ? 'Light Theme' : 'Dark Theme';
    };

    const quickSettingsBtn = document.getElementById('btn-quick-settings');
    const quickSettingsPanel = document.getElementById('quick-settings-panel');
    quickSettingsBtn.onclick = (e) => {
      e.stopPropagation();
      quickSettingsPanel.classList.toggle('hidden');
    };

    const contextMenu = document.getElementById('desktop-context-menu');
    const desktopCanvas = document.getElementById('desktop-canvas');

    desktopCanvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      contextMenu.style.left = `${Math.min(e.clientX, window.innerWidth - 240)}px`;
      contextMenu.style.top = `${Math.min(e.clientY, window.innerHeight - 280)}px`;
      contextMenu.classList.remove('hidden');
    });

    window.addEventListener('click', (e) => {
      if (!contextMenu.contains(e.target)) contextMenu.classList.add('hidden');
      if (!MatrixLauncher.panel.contains(e.target) && e.target !== MatrixLauncher.btn) MatrixLauncher.close();
      if (!quickSettingsPanel.contains(e.target) && !quickSettingsBtn.contains(e.target)) quickSettingsPanel.classList.add('hidden');
      document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('ring-2', 'ring-google-blue', 'bg-white/30'));
    });

    // Lasso Drag Selection
    (function setupLasso() {
      const lasso = document.getElementById('selection-lasso');
      let startX, startY, isSelecting = false;

      desktopCanvas.addEventListener('mousedown', (e) => {
        if (e.target !== desktopCanvas && e.target !== document.getElementById('desktop-icons-container')) return;
        isSelecting = true;
        startX = e.clientX;
        startY = e.clientY;
        lasso.style.left = `${startX}px`;
        lasso.style.top = `${startY}px`;
        lasso.style.width = '0px';
        lasso.style.height = '0px';
        lasso.style.display = 'block';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isSelecting) return;
        const currentX = e.clientX;
        const currentY = e.clientY;

        const left = Math.min(startX, currentX);
        const top = Math.min(startY, currentY);
        const width = Math.abs(currentX - startX);
        const height = Math.abs(currentY - startY);

        lasso.style.left = `${left}px`;
        lasso.style.top = `${top}px`;
        lasso.style.width = `${width}px`;
        lasso.style.height = `${height}px`;
      });

      window.addEventListener('mouseup', () => {
        if (isSelecting) {
          isSelecting = false;
          lasso.style.display = 'none';
        }
      });
    })();

    /* System Bootstrapping */
    window.addEventListener('DOMContentLoaded', () => {
      StorageEngine.init();
      AppRegistry.init();
      CloudSyncEngine.init();
      DockManager.render();
      DesktopIconManager.render();
      MatrixLauncher.init();
      Omnibox.init();

      // Launch default core window on start
      setTimeout(() => {
        WindowManager.launch('browser');
      }, 300);

      notify('Google Workspace OS Pro', 'All 10 foundation features and cloud synchronizers ready.', 'verified');
    });
  </script>
</body>
</html>
